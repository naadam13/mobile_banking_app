<style>

.grp{border-top:1px solid var(--line)}.grp:first-of-type{border-top:0}

.sub-l{margin:0 0 10px 21px;padding:0;list-style:none;font-size:12.5px}.sub-l li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:6px 0;border-top:1px dashed var(--line)}

.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-left:6px;vertical-align:1px}
.tag.w{background:var(--warnbg);color:var(--warn)}.tag.b{background:var(--badbg);color:var(--bad)}.tag.g{background:var(--goodbg);color:var(--good)}
.hrs{display:block}
.tl .mt{display:block;font-size:12.5px;color:var(--mut);margin:2px 0 4px;line-height:1.5}.tl .mt b,.tl .mt i{display:inline!important;color:var(--ink);font-weight:500;font-style:normal}.tl .mt>span{display:block!important;margin:0!important}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--out);vertical-align:-1px}

.tl .when{font-size:11px;font-weight:700;color:var(--mut);margin-top:2px}.tl li.k-late .d{background:var(--badbg);color:var(--bad)}.tl li.k-out .d{background:var(--warnbg);color:var(--warn)}

.sumbox{background:var(--acc2);border-radius:13px;padding:11px 13px;font-size:13.5px;margin-bottom:12px}
.persel{display:flex;gap:10px;align-items:center;margin:0 0 12px;font-size:13px;color:var(--mut)}.persel select{flex:1;min-width:0;font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sub-l .t .ac{display:block;margin:1px 0 0;font-size:11.5px;color:var(--mut)}
.sched{margin-top:14px;border:1px solid var(--acc);border-radius:16px;padding:14px;background:var(--acc2)}
.sched h4{margin:0 0 4px;font:700 15px/1.35 Roboto,system-ui,sans-serif}.sched p{margin:0 0 8px;font-size:13px}

.steps{margin:8px 0 0;padding:0;list-style:none;counter-reset:s}.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;padding:8px 0;font-size:13px;border-top:1px dashed var(--line)}

.tag.s{background:var(--tipbg);color:var(--tip)}

body{font-feature-settings:"tnum" 1;letter-spacing:.005em}

  if (top.length) h += `<section><h2>Prioritas untuk Anda</h2>${top.map((r,i)=>recHTML(r,i)).join('')}${rest.length?`<details class="more"><summary>${ico('dots')}Lihat ${rest.length} saran lainnya</summary>${rest.map(r=>recHTML(r,-1)).join('')}</details>`:''}</section>`;
  if (months.length) h += `<section><h2>Uang masuk dan keluar</h2><div class="card"><div class="legend"><span><i style="background:var(--in)"></i>Masuk</span><span><i style="background:var(--out)"></i>Keluar</span></div>${cashChart(months)}
   </div></section>`;
  h += `<section><h2>Dari mana uang Anda masuk</h2><div id="inc"></div></section>`;
  h += `<section><h2>Ke mana uang Anda pergi</h2><div id="brk"></div></section>`;
  h += calendar(id, d1);
  if (c2) {
    const EX = ['CEK_SALDO','PROFIL','KARTU','BANTUAN'];
    const op=(c2.fitur_hanya_dibuka||'').split(', ').filter(f=>f&&!EX.includes(f)), nv=(c2.fitur_belum_pernah||'').split(', ').filter(f=>f&&!EX.includes(f));
    const todo=[...op,...nv];
    if (todo.length) h += `<section><h2>Fitur yang belum Anda coba</h2>${todo.length?`<div class="card"><div class="feat">${todo.map(f=>featHTML(f,op.includes(f))).join('')}</div></div>`:`<div class="card"><p class="empty">${ico('check')}Semua fitur sudah dicoba</p></div>`}</section>`;
  }
  if (i3 || h1.length || h2) {
    const lg = x.login||{};
    h += `<section><h2>Keamanan dan kartu</h2><div class="card"><div class="kv">`;
    if (i3) h += `<span>${ico('lock')}Login biometrik</span><b class="${i3.biometric_enabled?'pos':'neg'}">${i3.biometric_enabled?'Aktif':'Belum aktif'}</b>${lg.n?`<span>${ico('key')}Login lewat</span><b>${lg.bio>=lg.pin&&lg.bio>=lg.pass?'Biometrik':lg.pin>=lg.pass?'PIN':'Kata sandi'}</b><span>${ico('alert')}Login gagal</span><b>${nf(lg.gagal)} dari ${nf(lg.n)}</b>`:''}<span>${ico('phone')}Perangkat</span><b>${i3.jml_perangkat_dipakai}</b>`;
    h1.forEach(k=>{ h += `<span>${ico('card')}Kartu ${esc(k.network)} ${esc(k.card_type.toLowerCase())}</span><b>${esc(k.status_pemakaian.replace(/\s*\(.*\)/,'').toLowerCase())} · ${nf(k.trx_12bln)} transaksi (12 bln)</b>`; });
    if (h2 && h2.trx_luar_negeri > 0) h += `<span>${ico('globe')}Transaksi luar negeri</span><b>${h2.trx_luar_negeri}${h2.mata_uang_asing_utama?' ('+esc(h2.mata_uang_asing_utama)+')':''}</b>`;
    h += '</div></div></section>';
  }
  h = h.replace(/<h2>([^<]+)<\/h2>/g,(m,s)=>{ const k=Object.keys(SECI).find(k=>s.startsWith(k)); return `<h2>${k?`<span class="hi2">${ico(SECI[k])}</span>`:''}${s}</h2>`; }); $('#out').innerHTML = h; CUR.id = id; CUR.per = '3b'; drawBreak();
}

/* dialog konfirmasi jadwal (semu: OK dan Batal hanya menutup dialog, tampilan halaman tidak berubah) */
let lastBtn = null;
const closeDlg = () => { $('#ov').hidden = true; if (lastBtn) { try { lastBtn.focus(); } catch(e){} } };
document.addEventListener('click', e => {
  const b = e.target.closest('[data-sch]');
  if (b) { const u = SCHQ[+b.dataset.sch]; if (!u) return; lastBtn = b;
    const [y,m,d] = u.date.split('-');
    $('#d-n').textContent = dn(u); $('#d-k').textContent = kd(u); { const tf = u.tp.startsWith('TRANSFER') && u.bank; document.querySelectorAll('#ov .tf').forEach(e=>e.hidden=!tf); if (tf) { $('#d-r').textContent = tc(u.item.split('|')[0]); $('#d-b').textContent = u.bank; $('#d-c').textContent = u.acct; } }
    $('#d-a').textContent = rpf(u.amt); $('#d-d').textContent = +d+' '+MONF[+m-1]+' '+y;
    $('#ov').hidden = false; $('#d-ok').focus(); return; }
  if (e.target.id === 'd-ok' || e.target.id === 'd-no' || e.target.id === 'ov') closeDlg();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ov').hidden) closeDlg(); });
const sel = $('#sel'), ids = Object.keys(PERSONA).map(Number);
sel.innerHTML = ids.map(i => { const z = R('Z1',i)[0]; return `<option value="${i}">${esc(z.full_name)}</option>`; }).join('');
function go(i) { sel.value = i; render(i); try { history.replaceState(null,'','#c'+i); } catch(e){} window.scrollTo(0,0); }
sel.onchange = () => go(+sel.value);
$('#th').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme = dark?'light':'dark'; };
const m = /^#c(\d+)/.exec(location.hash); go(m && ids.includes(+m[1]) ? +m[1] : ids[0]);

/* navigasi bawah: loncat ke bagian dan tandai bagian yang sedang dilihat */
(function(){ const nav=document.getElementById('tabnav'); if(!nav) return;
  const B=[...nav.querySelectorAll('button')];
  const secs=()=>B.map(b=>b.dataset.k==='top'?null:[...document.querySelectorAll('#out section')].find(s=>(s.querySelector('h2')||{textContent:''}).textContent.startsWith(b.dataset.k)));
  const mark=()=>{ const S=secs(), y=window.innerHeight*.35; let a=0; S.forEach((s,i)=>{ if(s&&s.getBoundingClientRect().top<y) a=i; }); if(scrollY<120) a=0; B.forEach((b,i)=>b.toggleAttribute('aria-current',i===a)); if(B[a]) B[a].setAttribute('aria-current','true'); B.forEach((b,i)=>{ if(i!==a) b.removeAttribute('aria-current'); }); };
  nav.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const s=secs()[B.indexOf(b)]; if(!s||b.dataset.k==='top'){ scrollTo({top:0,behavior:'smooth'}); } else { scrollTo({top:s.getBoundingClientRect().top+scrollY-70,behavior:'smooth'}); } });
  let q=0; addEventListener('scroll',()=>{ if(!q) q=requestAnimationFrame(()=>{q=0;mark();}); },{passive:true}); addEventListener('hashchange',mark); setTimeout(mark,50);
})();
</script>
