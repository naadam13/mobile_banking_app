<meta charset="utf-8">
<title>Peta Perilaku Nasabah</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Konsep: aplikasi dua panel (daftar nasabah | detail). Di ponsel menjadi dua layar. Angka memakai mono, teks memakai Plus Jakarta Sans. */
:root{
  --bg:#eceff5; --surface:#ffffff; --surface2:#f5f7fb; --ink:#13202f; --muted:#5a6a7e; --line:#d9e0ea;
  --accent:#1c4fd6; --accent-soft:#e2eafc; --on-accent:#ffffff;
  --good:#0c7f58; --good-soft:#dcf3ea; --warn:#9a5b00; --warn-soft:#fbecd0; --bad:#b83225; --bad-soft:#fbe0dc;
  --inc:#1c4fd6; --exp:#d7701f; --grid:#e3e8f0;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d131b; --surface:#151d28; --surface2:#1b2533; --ink:#e6edf6; --muted:#93a3b8; --line:#273445;
  --accent:#7aa2ff; --accent-soft:#1b2a4d; --on-accent:#0d131b;
  --good:#3fcb98; --good-soft:#12342a; --warn:#e6a53f; --warn-soft:#3a2b10; --bad:#f08577; --bad-soft:#3d1c18;
  --inc:#7aa2ff; --exp:#f2985a; --grid:#233042; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131b; --surface:#151d28; --surface2:#1b2533; --ink:#e6edf6; --muted:#93a3b8; --line:#273445;
  --accent:#7aa2ff; --accent-soft:#1b2a4d; --on-accent:#0d131b;
  --good:#3fcb98; --good-soft:#12342a; --warn:#e6a53f; --warn-soft:#3a2b10; --bad:#f08577; --bad-soft:#3d1c18;
  --inc:#7aa2ff; --exp:#f2985a; --grid:#233042; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;margin:0;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:360px minmax(0,1fr);height:100%}
#list{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#detail{overflow-y:auto;min-width:0;position:relative}
.bar{padding:14px max(16px,env(safe-area-inset-left,0px)) 10px 16px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.theme{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:12px}
#q{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#cards{overflow-y:auto;flex:1;padding:10px 12px 20px;display:flex;flex-direction:column;gap:8px}
.ncard{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%}
.ncard:hover{border-color:var(--accent)}
.ncard[aria-current=true]{border-color:var(--accent);background:var(--accent-soft)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
.ncard h3{margin:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncard .persona{font-size:12px;color:var(--muted);margin:1px 0 6px}
.mini{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.mini b{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
#top{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px;align-items:center;gap:8px}
#top button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 12px;font-weight:600}
.wrap{max-width:980px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px 16px}
.hero{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:14px}
.hero .av{width:64px;height:64px;font-size:22px}
.hero h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.015em}
.hero p{margin:2px 0 6px;color:var(--muted)}
.tabs{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;margin:0 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 13px;font-weight:600;font-size:13px;color:var(--muted)}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card.span{grid-column:1/-1}
.card>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.card h3{margin:0;font-size:14px;font-weight:700}
.qcode{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
.empty{color:var(--muted);font-size:13px;background:var(--surface2);border-radius:10px;padding:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi strong{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.kpi strong.sm{font-size:15px;line-height:1.35;padding-top:3px}
.kpi span{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right;font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.kv dd.t{font-family:var(--font)}
.insights{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.insights li{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px}
.insights li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px}
.insights li.warn::before{background:var(--warn)} .insights li.bad::before{background:var(--bad)} .insights li.good::before{background:var(--good)}
.brow{display:grid;grid-template-columns:minmax(80px,38%) minmax(0,1fr) auto;gap:10px;align-items:center;margin:6px 0}
.brow .l{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .tr{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.brow .fl{height:100%;border-radius:5px;background:var(--accent)}
.brow .fl.exp{background:var(--exp)} .brow .fl.good{background:var(--good)} .brow .fl.warn{background:var(--warn)} .brow .fl.bad{background:var(--bad)}
.brow .v{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:42px;text-align:right}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11.5px;position:sticky;top:0;background:var(--surface)}
td.n{font-family:var(--mono);text-align:right}
.fgroup{margin-bottom:12px}
.fgroup h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fc{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface2);min-width:0}
.fc b{display:block;font-size:12.5px}
.fc small{font-family:var(--mono);color:var(--muted);font-size:11px}
.fc.used{background:var(--good-soft);border-color:transparent} .fc.used b{color:var(--good)}
.fc.open{background:var(--warn-soft);border-color:transparent} .fc.open b{color:var(--warn)}
.fc.none{opacity:.7}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:6px 0 4px}
.step{font-size:10.5px;text-align:center;padding:6px 2px;border-radius:8px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);line-height:1.25}
.step.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.step.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.step.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:700}
.qlist details{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
.qlist summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline;font-weight:600}
.qlist summary span:last-child{color:var(--muted);font-weight:400;font-size:12px;margin-left:auto;white-space:nowrap}
.qlist .body{padding:0 14px 12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.foot{color:var(--muted);font-size:12px;margin-top:22px}
@media (max-width:900px){
  #app{display:block;height:auto}
  #list{height:100vh;border-right:0}
  #detail{display:none;overflow:visible}
  #app[data-view=detail] #list{display:none}
  #app[data-view=detail] #detail{display:block}
  #top{display:flex}
  .wrap{padding-top:12px}
}
@media (prefers-reduced-motion:no-preference){.card,.kpi{animation:in .25s ease-out both}@keyframes in{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* ===== v3 skin: modern mobile-banking look ===== */
:root{--bg:#f2f5fc;--surface:#fff;--surface2:#f4f7fd;--ink:#0a1b3d;--muted:#5f6f8c;--line:#e6ebf6;--accent:#1553e6;--accent-soft:#eaf0ff;--inc:#1553e6;--sh:0 1px 2px rgba(16,40,100,.05),0 10px 28px rgba(16,40,100,.07);--hero:linear-gradient(140deg,#0b2f9e 0%,#1553e6 52%,#3b82f6 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero:linear-gradient(140deg,#0b1f5c 0%,#12399f 55%,#2257d6 100%);--sh:none}}
:root[data-theme="dark"]{--hero:linear-gradient(140deg,#0b1f5c 0%,#12399f 55%,#2257d6 100%);--sh:none}
#list{border-right:0;box-shadow:0 0 0 1px var(--line),8px 0 30px rgba(16,40,100,.06)}
.bar{background:var(--hero);color:#fff;padding:max(16px,env(safe-area-inset-top)) 16px 16px;border-radius:0 0 24px 24px;box-shadow:0 12px 28px rgba(21,83,230,.25);position:relative;z-index:2}
.brand h1{color:#fff;font-size:19px}.brand small{color:rgba(255,255,255,.78)}
.theme{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:99px;padding:6px 13px;font-weight:600}
#q{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:14px;padding:11px 14px}
#q::placeholder{color:rgba(255,255,255,.75)}#q:focus-visible{outline-color:#fff}
.chips{border-bottom:0;padding:14px 16px 10px}
.chip{border-color:transparent;background:var(--surface2);padding:6px 13px;font-weight:600}
.chip[aria-pressed=true]{background:linear-gradient(135deg,#1553e6,#3b82f6);color:#fff;box-shadow:0 6px 14px rgba(21,83,230,.28)}
#cards{gap:10px;padding:6px 14px 24px}
.ncard{border-color:transparent;border-radius:18px;box-shadow:var(--sh);padding:13px;transition:transform .12s,box-shadow .12s}
.ncard:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(16,40,100,.12);border-color:transparent}
.ncard[aria-current=true]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.ncard h3{font-size:14.5px}
.tag{border-radius:99px;padding:2px 9px}
#top{background:var(--hero);border-bottom:0;color:#fff}#top button{background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:6px 14px}
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:26px;padding:20px;margin-bottom:16px;box-shadow:0 18px 40px rgba(21,83,230,.28)}
.hero::before{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-100px;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.hero>*{position:relative}.hero p{color:rgba(255,255,255,.82)}.hero h2{font-size:24px}
.hero .av{box-shadow:0 0 0 3px rgba(255,255,255,.55)}
.hero .tag{border:0}
.tabs{padding:10px 0 12px}
.tab{border-color:transparent;background:var(--surface);box-shadow:0 1px 2px rgba(16,40,100,.08);border-radius:99px;padding:7px 15px}
.tab[aria-selected=true]{background:linear-gradient(135deg,#1553e6,#3b82f6);border-color:transparent;color:#fff;box-shadow:0 6px 14px rgba(21,83,230,.3)}
.card,.kpi{border-color:transparent;border-radius:20px;box-shadow:var(--sh);padding:16px 18px}
.kpi strong{font-size:23px}
.qcode{border-radius:99px;background:var(--surface2);border-color:transparent;padding:1px 8px}
.insights li::before{width:9px;height:9px}
.brow .tr{height:8px;border-radius:8px}.brow .fl{border-radius:8px}
.fc{border-radius:12px}.step{border-radius:10px}
.qlist details{border-radius:16px;border-color:transparent;box-shadow:var(--sh)}
.empty{border-radius:14px}
th{background:var(--surface)}
@media (max-width:900px){#list{box-shadow:none}.bar{border-radius:0 0 22px 22px}}

/* ===== v4: icon-forward ===== */
svg.i{display:inline-block;width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.theme{display:grid;place-items:center;width:36px;height:36px;padding:0!important;border-radius:50%!important}.theme svg.i{width:19px;height:19px;vertical-align:0}
.chip{display:inline-flex;align-items:center;gap:6px}.chip svg.i{width:14px;height:14px}
.tab{display:inline-flex;align-items:center;gap:7px}.tab svg.i{width:16px;height:16px}
.mini{gap:14px}.mini span{display:inline-flex;align-items:center;gap:5px}.mini svg.i{width:15px;height:15px;color:var(--accent)}
.kpi{position:relative}.kpi .ki{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin-bottom:8px;background:var(--accent-soft);color:var(--accent)}.kpi .ki svg.i{width:18px;height:18px;vertical-align:0}
.card>header h3{display:flex;align-items:center;gap:9px}.card .qi{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent)}.card .qi svg.i{width:16px;height:16px;vertical-align:0}
.insights li{grid-template-columns:22px minmax(0,1fr)}.insights li::before{display:none}.insights li>i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;margin-top:0;color:var(--accent);background:var(--accent-soft)}
.insights li>i svg.i{width:13px;height:13px;vertical-align:0}
.insights li.warn>i{color:var(--warn);background:var(--warn-soft)}.insights li.bad>i{color:var(--bad);background:var(--bad-soft)}.insights li.good>i{color:var(--good);background:var(--good-soft)}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;padding:2px 16px 6px;font-size:11px;color:var(--muted)}.lgd span{display:inline-flex;align-items:center;gap:4px}.lgd svg.i{width:13px;height:13px;color:var(--accent)}
</style>

<script>
const DATA = /*DATA*/null;
const TITLES = /*TITLES*/null;
const PERSONA = /*PERSONA*/null;
const META = /*META*/null;

/* ---------- util ---------- */
const $ = (s, r = document) => r.querySelector(s);
const ico=(n,c='')=>`<svg class="i ${c}" aria-hidden="true" focusable="false"><use href="#i-${n}"/></svg>`;
const TABI={ringkasan:'layers',transaksi:'swap',arus:'chart',fitur:'spark',gajian:'cash',cicilan:'cal',kredit:'coins',kartu:'card',engagement:'activity',data:'list'};
const CHI={'Semua':'users','Aktif tinggi':'up','Aktif ringan':'activity','Berhenti':'alert','Berkredit':'coins','Tanpa kredit':'wallet'};
const KPI_I={'Skor kesehatan':'gauge','Segmen RFM':'users','Peringatan churn':'alert','Arus kas 12 bulan':'chart'};
const QI={Z:'user',A:'swap',B:'chart',C:'spark',D:'cash',E:'cal',F:'cal',G:'coins',H:'card',I:'activity'};
const INSI={bad:'warn',warn:'alert',good:'check',acc:'info'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = new Intl.NumberFormat('id-ID');
const n0 = v => v == null ? '-' : nf.format(Math.round(v));
const n1 = v => v == null ? '-' : new Intl.NumberFormat('id-ID', {maximumFractionDigits: 1}).format(v);
const pct = v => v == null ? '-' : n1(v) + '%';
function rp(v){ if (v == null) return '-'; const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e9) return s + 'Rp ' + n1(a / 1e9) + ' M';
  if (a >= 1e6) return s + 'Rp ' + n1(a / 1e6) + ' jt';
  if (a >= 1e3) return s + 'Rp ' + n0(a / 1e3) + ' rb';
  return s + 'Rp ' + n0(a); }
const TX = {QRIS_PAYMENT:'QRIS',EWALLET_TOPUP:'Top-up e-wallet',PULSA_DATA:'Pulsa & data',TRANSFER_BANK:'Transfer bank',TRANSFER_INTERNAL:'Transfer antar rekening',BILL_PAYMENT:'Tagihan',CARD_CONTACTLESS:'Kartu contactless',CARD_POS:'Kartu POS',CARD_ONLINE:'Kartu online',CARD_INTL:'Kartu luar negeri',ATM_WITHDRAWAL:'Tarik tunai ATM',LOAN_INSTALLMENT:'Cicilan',ADMIN_FEE:'Biaya admin',SAVINGS_OUT:'Tarik tabungan'};
const FT = {CEK_SALDO:'Cek saldo',MUTASI:'Mutasi',QRIS:'QRIS',TRANSFER:'Transfer',TOPUP_EWALLET:'Top-up e-wallet',TAGIHAN:'Tagihan',PULSA_DATA:'Pulsa & data',PROMO:'Promo',BANTUAN:'Bantuan',PROFIL:'Profil',KARTU:'Kartu',JADWAL_BAYAR:'Jadwal Bayar',PAYLATER:'Paylater',KTA:'KTA',CICILAN:'Cicilan'};
const CAT = {TRANSACTION:'Transaksi',INQUIRY:'Informasi rekening',CREDIT:'Kredit',SETTING:'Pengaturan',INFO:'Info'};
const tx = k => TX[k] || k || '-';
const ft = k => FT[k] || k;
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const mon = s => { const d = String(s).slice(0, 7).split('-'); return BLN[+d[1] - 1] + ' ' + d[0].slice(2); };
const qtr = s => { const d = String(s).split('-'); return 'K' + (Math.floor((+d[1] - 1) / 3) + 1) + ' ' + d[0].slice(2); };
const dmy = s => { if (!s) return '-'; const d = String(s).slice(0, 10).split('-'); return +d[2] + ' ' + BLN[+d[1] - 1] + ' ' + d[0]; };
const tone = {
  'Sehat (>= 80)':'good','Cukup (60-79)':'acc','Perlu perhatian (40-59)':'warn','Berisiko (< 40)':'bad',
  NORMAL:'good','AKTIVITAS RENDAH':'warn',WASPADA:'warn',KRITIS:'bad','SUDAH NONAKTIF':'bad',
  SEHAT:'good',PANTAU:'acc',TINGGI:'bad',SEDANG:'warn',RENDAH:'good',
  'Defisit kronis':'bad',Boros:'bad',Tipis:'warn',Seimbang:'acc',Hemat:'good',
  AKTIF:'good','MENURUN (> 30 hari)':'warn','TIDUR (> 60 hari)':'bad','CHURN (dinonaktifkan)':'bad','BARU (<= 3 bulan)':'acc',
  DIPAKAI:'good','HANYA DIBUKA':'warn','BELUM PERNAH DIBUKA':'',
  'PERNAH TAPI BATAL':'warn','BELUM PERNAH':'','TIDAK PUNYA CICILAN':'',
  MEMBAIK:'good',MEMBURUK:'bad',SAMA:'acc'
};
const T = (txt, t) => `<span class="tag ${t ?? tone[txt] ?? ''}">${esc(txt)}</span>`;
const hue = id => (id * 47) % 360;
const initials = n => n.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
const av = (c, cls = '') => `<div class="av ${cls}" style="background:hsl(${hue(c.customer_id)} 42% 38%)" aria-hidden="true">${esc(initials(c.full_name))}</div>`;

/* ---------- index ---------- */
const IDX = {};
for (const [lab, rows] of Object.entries(DATA)) { IDX[lab] = {}; for (const r of rows) (IDX[lab][r.customer_id] ||= []).push(r); }
const rowsOf = (lab, id) => IDX[lab]?.[id] || [];
const one = (lab, id) => rowsOf(lab, id)[0] || null;
const CUST = META.map(m => ({...one('Z1', m.customer_id), persona: m.persona, group: m.group, spark: m.spark}));

/* ---------- components ---------- */
const card = (title, code, body, opts = {}) => `<section class="card ${opts.span ? 'span' : ''}"><header><h3><span class="qi">${ico(QI[code[0]] || 'dots')}</span>${esc(title)}</h3><span class="qcode" title="${esc(TITLES[code] || '')}">${code}</span></header>${body}${opts.note ? `<p class="note">${opts.note}</p>` : ''}</section>`;
const empty = msg => `<p class="empty">${msg}</p>`;
const kv = pairs => `<dl class="kv">${pairs.filter(Boolean).map(([k, v, raw]) => `<dt>${esc(k)}</dt><dd class="${raw ? 't' : ''}">${raw ? v : esc(v ?? '-')}</dd>`).join('')}</dl>`;
function bars(items, o = {}) {
  const max = o.max ?? Math.max(1, ...items.map(i => i.value || 0));
  return items.map(i => `<div class="brow"><span class="l" title="${esc(i.label)}">${esc(i.label)}</span><span class="tr"><span class="fl ${i.tone || ''}" style="display:block;width:${Math.max(0, Math.min(100, 100 * (i.value || 0) / max))}%"></span></span><span class="v">${esc(i.text ?? n0(i.value))}</span></div>`).join('');
}
function table(cols, rows, o = {}) {
  if (!rows.length) return empty('Tidak ada baris.');
  const head = cols.map(c => `<th>${esc(c.h)}</th>`).join('');
  const body = rows.slice(0, o.limit || 60).map(r => `<tr>${cols.map(c => { const v = c.f ? c.f(r) : r[c.k]; return `<td class="${c.n ? 'n' : ''}">${c.raw ? v : esc(v ?? '-')}</td>`; }).join('')}</tr>`).join('');
  return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${rows.length > (o.limit || 60) ? `<p class="note">Menampilkan ${o.limit || 60} dari ${rows.length} baris.</p>` : ''}`;
}
function barChart(series, o) {
  // series: [{label, a, b}] a = pemasukan, b = pengeluaran ; o: {h, fmt}
  const H = o.h || 170, pl = 38, pb = 22, pt = 8, bw = 9, gap = 6, W = pl + series.length * (2 * bw + gap) + 8;
  const max = Math.max(1, ...series.map(s => Math.max(s.a || 0, s.b || 0)));
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  let g = '';
  for (const f of [0, .5, 1]) g += `<line x1="${pl}" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--grid)"/><text x="${pl - 4}" y="${y(max * f) + 3}" text-anchor="end">${o.fmt(max * f)}</text>`;
  series.forEach((s, i) => {
    const x = pl + 4 + i * (2 * bw + gap);
    const def = (s.b || 0) > (s.a || 0);
    g += `<rect x="${x}" y="${y(s.a || 0)}" width="${bw}" height="${H - pb - y(s.a || 0)}" rx="2" fill="var(--inc)"><title>${esc(s.label)} pemasukan ${o.fmt(s.a || 0)}</title></rect>`;
    g += `<rect x="${x + bw}" y="${y(s.b || 0)}" width="${bw}" height="${H - pb - y(s.b || 0)}" rx="2" fill="var(--exp)"><title>${esc(s.label)} pengeluaran ${o.fmt(s.b || 0)}</title></rect>`;
    if (def) g += `<circle cx="${x + bw}" cy="${H - 8}" r="2.5" fill="var(--bad)"/>`;
    if (i % 3 === 0) g += `<text x="${x}" y="${H - 9}" ${def ? '' : ''}>${esc(s.label)}</text>`;
  });
  return `<div class="scroll"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${g}</svg></div>`;
}
function singleBars(series, o) {
  const H = o.h || 130, pl = 30, pb = 20, pt = 8, bw = 12, gap = 5, W = pl + series.length * (bw + gap) + 8;
  const max = o.max ?? Math.max(1, ...series.map(s => s.v || 0));
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  let g = '';
  for (const f of [0, 1]) g += `<line x1="${pl}" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--grid)"/><text x="${pl - 4}" y="${y(max * f) + 3}" text-anchor="end">${o.fmt ? o.fmt(max * f) : n0(max * f)}</text>`;
  if (o.line != null) g += `<line x1="${pl}" x2="${W}" y1="${y(o.line)}" y2="${y(o.line)}" stroke="var(--bad)" stroke-dasharray="3 3"/>`;
  series.forEach((s, i) => { const x = pl + 4 + i * (bw + gap);
    g += `<rect x="${x}" y="${y(s.v || 0)}" width="${bw}" height="${Math.max(1, H - pb - y(s.v || 0))}" rx="2" fill="${s.c || 'var(--accent)'}"><title>${esc(s.label)}: ${o.fmt ? o.fmt(s.v || 0) : n0(s.v || 0)}</title></rect>`;
    if (i % (o.every || 3) === 0) g += `<text x="${x}" y="${H - 6}">${esc(s.label)}</text>`; });
  return `<div class="scroll"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${g}</svg></div>`;
}
const yesno = v => v === true ? 'Ya' : v === false ? 'Tidak' : '-';

/* ---------- tab renderers ---------- */
function insights(c) {

    return `<details><summary><span class="qcode">${l}</span><span>${esc(TITLES[l] || '')}</span><span>${rs.length} baris</span></summary><div class="body">${rs.length ? table(cols, rs, {limit: 40}) : empty('Tidak ada baris untuk nasabah ini.')}</div></details>`;
  }).join('')}</div>`;
}
const TABS = [['ringkasan', 'Ringkasan', tabRingkasan], ['transaksi', 'Transaksi', tabTransaksi], ['arus', 'Arus kas', tabArus], ['fitur', 'Fitur', tabFitur], ['gajian', 'Gajian', tabGajian], ['cicilan', 'Cicilan & jadwal', tabCicilan], ['kredit', 'Paylater & KTA', tabKredit], ['kartu', 'Kartu', tabKartu], ['engagement', 'Engagement', tabEngagement], ['data', 'Data query', tabData]];

/* ---------- shell ---------- */
const state = {id: null, tab: 'ringkasan', q: '', group: 'Semua'};
const GROUPS = ['Semua', 'Aktif tinggi', 'Aktif ringan', 'Berhenti', 'Berkredit', 'Tanpa kredit'];
function groupsOf(c) {
  const g = [];
  if (c.tahap_siklus && c.tahap_siklus.startsWith('CHURN')) g.push('Berhenti');
  else if (c.spark >= 150) g.push('Aktif tinggi'); else g.push('Aktif ringan');
  g.push(c.pinjaman_aktif > 0 ? 'Berkredit' : 'Tanpa kredit');
  return g;
}
function renderList() {
  $('#chips').innerHTML = GROUPS.map(g => `<button class="chip" type="button" aria-pressed="${state.group === g}" data-g="${g}">${ico(CHI[g] || 'dots')}${g}</button>`).join('');
  const q = state.q.toLowerCase();
  const list = CUST.filter(c => (state.group === 'Semua' || groupsOf(c).includes(state.group)) && (!q || (c.full_name + ' ' + c.occupation + ' ' + c.persona).toLowerCase().includes(q)));
  $('#cards').innerHTML = list.map(c => `<button class="ncard" type="button" data-id="${c.customer_id}" aria-current="${c.customer_id === state.id}">${av(c)}<div style="min-width:0"><h3>${esc(c.full_name)}</h3><div class="persona">${esc(c.persona)}</div><div class="mini"><span title="Skor kesehatan">${ico('gauge')}<b>${n0(c.skor_kesehatan)}</b></span><span title="Sesi 90 hari terakhir">${ico('phone')}<b>${n0(c.spark)}</b></span><span title="Transaksi keluar 12 bulan">${ico('swap')}<b>${n0(c.trx_keluar_12bln)}</b></span><span title="Pinjaman aktif">${ico('coins')}<b>${c.pinjaman_aktif ?? 0}</b></span></div></div></button>`).join('') || empty('Tidak ada nasabah yang cocok.');
}
function renderDetail() {
  const c = CUST.find(x => x.customer_id === state.id);
  if (!c) { $('#wrap').innerHTML = empty('Pilih nasabah di daftar.'); return; }
  $('#topName').textContent = c.full_name;
  const tab = TABS.find(t => t[0] === state.tab) || TABS[0];
  $('#wrap').innerHTML = `<div class="hero">${av(c)}<div><h2>${esc(c.full_name)}</h2><p>${esc(c.occupation)} · ${esc(c.age_band.slice(2))} th · ${esc(c.city)} · <span class="mono">ID ${c.customer_id}</span></p><div style="display:flex;gap:6px;flex-wrap:wrap">${T(c.persona, 'acc')}${T(c.tahap_siklus)}</div></div></div>
  <nav class="tabs" role="tablist" aria-label="Bagian">${TABS.map(t => `<button class="tab" role="tab" type="button" data-t="${t[0]}" aria-selected="${t[0] === state.tab}">${ico(TABI[t[0]] || 'dots')}${t[1]}</button>`).join('')}</nav>
  <div role="tabpanel">${tab[2](c)}</div>
  <p class="foot">Sumber: hasil query analisis_behaviour_per_nasabah.sql pada PostgreSQL lokal. Kode di pojok kartu (mis. B1) adalah nomor query; data buatan, bukan nasabah sebenarnya.</p>`;
}
function go(id, tab) {
  state.id = id; if (tab) state.tab = tab;
  try { history.replaceState(null, '', '#c' + id + (state.tab !== 'ringkasan' ? '-' + state.tab : '')); } catch (e) {}
  $('#app').dataset.view = 'detail';
  renderList(); renderDetail(); $('#detail').scrollTop = 0; window.scrollTo(0, 0);
}
function fromHash() {
  const m = /^#c(\d+)(?:-(\w+))?$/.exec(location.hash);
  if (m && CUST.some(c => c.customer_id === +m[1])) { state.id = +m[1]; if (m[2] && TABS.some(t => t[0] === m[2])) state.tab = m[2]; $('#app').dataset.view = 'detail'; }
  else { state.id = state.id ?? CUST[0].customer_id; $('#app').dataset.view = 'list'; }
  renderList(); renderDetail();
}
document.addEventListener('click', e => {
  const n = e.target.closest('.ncard'); if (n) return go(+n.dataset.id);
  const t = e.target.closest('.tab'); if (t) { state.tab = t.dataset.t; try { history.replaceState(null, '', '#c' + state.id + (state.tab !== 'ringkasan' ? '-' + state.tab : '')); } catch (e) {} renderDetail(); const w = $('.tabs'); if (w) w.scrollIntoView({block: 'start'}); return; }
  const g = e.target.closest('.chip'); if (g) { state.group = g.dataset.g; renderList(); }
});
$('#q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('#back').addEventListener('click', () => { $('#app').dataset.view = 'list'; try { history.replaceState(null, '', location.pathname); } catch (e) {} });
$('#themeBtn').addEventListener('click', () => {
  const root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
window.addEventListener('hashchange', fromHash);
$('#sub').textContent = `${CUST.length} nasabah contoh dari ${META_TOTAL()} hasil generate`;
function META_TOTAL() { return window.__TOTAL__ || 150; }
fromHash();
</script>
